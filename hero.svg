<svg width="820" height="580" viewBox="0 0 820 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0f1a"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </linearGradient>

    <!-- Pink glow filter -->
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip for avatar circle -->
    <clipPath id="avatarClip">
      <circle cx="410" cy="215" r="72"/>
    </clipPath>

    <!-- Clip for card bottom rounded -->
    <clipPath id="leftCard">
      <rect x="203" y="310" width="262" height="250" rx="14"/>
    </clipPath>
    <clipPath id="rightCard">
      <rect x="479" y="310" width="330" height="250" rx="14"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════
       BACKGROUND
  ════════════════════════════════════════════ -->
  <rect width="820" height="580" fill="url(#bg)" rx="0"/>

  <!-- Subtle dot grid texture -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#ffffff" fill-opacity="0.04"/>
  </pattern>
  <rect width="820" height="580" fill="url(#dots)"/>

  <!-- ═══════════════════════════════════════════
       ROW 1 — SOCIAL BUTTONS (5 pills)
       Matching: X/Twitter | LinkedIn | [logo] | YouTube | Twitch
  ════════════════════════════════════════════ -->

  <!-- Button 1: X / Twitter -->
  <rect x="203" y="14" width="118" height="36" rx="18" fill="#0d0f1a" stroke="#cc1170" stroke-width="1.5"/>
  <!-- X icon -->
  <text x="221" y="37" font-family="Arial" font-size="14" fill="#e0e0e0" font-weight="bold">✕</text>
  <text x="238" y="37" font-family="Arial" font-size="13" fill="#e0e0e0" font-weight="600">X / Twitter</text>

  <!-- Button 2: LinkedIn -->
  <rect x="329" y="14" width="116" height="36" rx="18" fill="#0d0f1a" stroke="#cc1170" stroke-width="1.5"/>
  <!-- in icon box -->
  <rect x="342" y="22" width="18" height="18" rx="3" fill="#0A66C2"/>
  <text x="348" y="35" font-family="Arial" font-size="11" fill="#ffffff" font-weight="bold">in</text>
  <text x="366" y="37" font-family="Arial" font-size="13" fill="#e0e0e0" font-weight="600">LinkedIn</text>

  <!-- Button 3: Middle logo button (like Graham's custom logo) -->
  <rect x="452" y="14" width="60" height="36" rx="18" fill="#0d0f1a" stroke="#cc1170" stroke-width="1.5"/>
  <!-- Diamond/logo shape -->
  <polygon points="482,22 494,32 482,42 470,32" fill="none" stroke="#cc1170" stroke-width="2"/>
  <polygon points="482,26 489,32 482,38 475,32" fill="#cc1170"/>

  <!-- Button 4: YouTube -->
  <rect x="520" y="14" width="118" height="36" rx="18" fill="#0d0f1a" stroke="#cc1170" stroke-width="1.5"/>
  <!-- YT play button -->
  <rect x="533" y="22" width="20" height="14" rx="3" fill="#FF0000"/>
  <polygon points="539,25 547,29 539,33" fill="#ffffff"/>
  <text x="559" y="37" font-family="Arial" font-size="13" fill="#e0e0e0" font-weight="600">YouTube</text>

  <!-- Button 5: Twitch -->
  <rect x="646" y="14" width="105" height="36" rx="18" fill="#0d0f1a" stroke="#cc1170" stroke-width="1.5"/>
  <!-- Twitch icon -->
  <rect x="659" y="22" width="14" height="16" rx="2" fill="none" stroke="#9146FF" stroke-width="2"/>
  <line x1="663" y1="26" x2="663" y2="30" stroke="#9146FF" stroke-width="1.5"/>
  <line x1="667" y1="26" x2="667" y2="30" stroke="#9146FF" stroke-width="1.5"/>
  <text x="678" y="37" font-family="Arial" font-size="13" fill="#e0e0e0" font-weight="600">Twitch</text>

  <!-- ═══════════════════════════════════════════
       ROW 2 — HERO: Speech bubble + person photo
  ════════════════════════════════════════════ -->

  <!-- Pink ambient glow behind avatar -->
  <circle cx="570" cy="195" r="90" fill="#cc1170" fill-opacity="0.08" filter="url(#softBloom)"/>

  <!-- Speech bubble -->
  <rect x="203" y="68" width="230" height="120" rx="14" fill="#1a0828" stroke="#8b2fc9" stroke-width="2"/>
  <!-- Bubble tail pointing right -->
  <polygon points="433,110 455,120 433,130" fill="#1a0828"/>
  <polygon points="433,111 453,120 433,129" fill="#8b2fc9"/>
  <polygon points="434,113 450,120 434,127" fill="#1a0828"/>

  <text x="318" y="100" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Hey! I'm Tanisha 👋</text>
  <text x="318" y="120" font-family="Arial" font-size="12" fill="#cccccc" text-anchor="middle">DevOps Engineer building</text>
  <text x="318" y="138" font-family="Arial" font-size="12" fill="#cccccc" text-anchor="middle">production-grade systems</text>
  <text x="318" y="158" font-family="Arial" font-size="12" fill="#ee3399" text-anchor="middle" font-weight="bold">🚀 Open to Internships!</text>

  <!-- Person silhouette / avatar area with pink glow ring -->
  <!-- Outer glow ring -->
  <circle cx="570" cy="195" r="85" fill="none" stroke="#cc1170" stroke-width="3" stroke-opacity="0.6" filter="url(#pinkGlow)"/>
  <circle cx="570" cy="195" r="82" fill="none" stroke="#8b2fc9" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Avatar background -->
  <circle cx="570" cy="195" r="80" fill="#1a0828"/>

  <!-- Avatar placeholder text — user replaces with their photo -->
  <text x="570" y="185" font-family="Arial" font-size="32" fill="#8b2fc9" text-anchor="middle" font-weight="bold">TK</text>
  <text x="570" y="208" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">Upload your photo</text>
  <text x="570" y="222" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">See instructions below</text>

  <!-- Thumbs up emoji style decoration -->
  <text x="648" y="160" font-family="Arial" font-size="22" fill="#cc1170" opacity="0.7">👍</text>

  <!-- Name / tagline beside avatar -->
  <text x="680" y="145" font-family="Arial" font-size="18" fill="#ffffff" font-weight="bold">Tanisha</text>
  <text x="680" y="168" font-family="Arial" font-size="18" fill="#ffffff" font-weight="bold">Kushwah</text>
  <text x="680" y="192" font-family="Arial" font-size="11" fill="#ee3399">DevOps Engineer</text>
  <text x="680" y="208" font-family="Arial" font-size="11" fill="#8b8b9e">AWS · K8s · Docker</text>
  <text x="680" y="226" font-family="Arial" font-size="11" fill="#8b8b9e">Terraform · Jenkins</text>
  <text x="680" y="248" font-family="Arial" font-size="10" fill="#555555">🎯 Cloud Architect Goal</text>
  <text x="680" y="264" font-family="Arial" font-size="10" fill="#555555">📍 India</text>

  <!-- ═══════════════════════════════════════════
       ROW 3 — TWO CARDS
       Left:  My Projects (like "My Writing")
       Right: VibeScan (like "A1ly Monsters")
  ════════════════════════════════════════════ -->

  <!-- ── LEFT CARD ── -->
  <rect x="203" y="298" width="262" height="266" rx="14" fill="#110820" stroke="#2a1040" stroke-width="1"/>

  <!-- Left card: top section -->
  <text x="222" y="328" font-family="Arial" font-size="15" fill="#ffffff" font-weight="bold">My Projects</text>

  <!-- Read button -->
  <rect x="322" y="314" width="60" height="24" rx="12" fill="#0d0f1a" stroke="#8b2fc9" stroke-width="1.5"/>
  <text x="352" y="331" font-family="Arial" font-size="11" fill="#e0e0e0" text-anchor="middle" font-weight="600">Explore</text>

  <!-- Study button -->
  <rect x="391" y="314" width="60" height="24" rx="12" fill="#0d0f1a" stroke="#8b2fc9" stroke-width="1.5"/>
  <text x="421" y="331" font-family="Arial" font-size="11" fill="#e0e0e0" text-anchor="middle" font-weight="600">GitHub</text>

  <text x="222" y="350" font-family="Arial" font-size="11" fill="#8b8b9e" xml:space="preserve">Building production-grade DevOps</text>
  <text x="222" y="365" font-family="Arial" font-size="11" fill="#8b8b9e">systems on AWS — not just learning</text>
  <text x="222" y="380" font-family="Arial" font-size="11" fill="#8b8b9e">tools, but shipping real infra.</text>

  <!-- Divider -->
  <line x1="203" y1="395" x2="465" y2="395" stroke="#2a1040" stroke-width="1"/>

  <!-- DEV-style logo box for VibeScan -->
  <rect x="218" y="408" width="64" height="44" rx="8" fill="#ee3399"/>
  <text x="250" y="437" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="900">VS</text>

  <!-- Center circle image area (like Graham's circular photo) -->
  <circle cx="352" cy="448" r="52" fill="#1a0828" stroke="#ee3399" stroke-width="2"/>
  <!-- AWS icon representation -->
  <text x="352" y="442" font-family="Arial" font-size="11" fill="#FF9900" text-anchor="middle" font-weight="bold">AWS</text>
  <text x="352" y="457" font-family="Arial" font-size="9" fill="#8b8b9e" text-anchor="middle">DevOps</text>
  <text x="352" y="470" font-family="Arial" font-size="9" fill="#8b8b9e" text-anchor="middle">Engineer</text>

  <!-- Bottom of left card -->
  <text x="218" y="517" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">VibeScan</text>
  <text x="218" y="533" font-family="Arial" font-size="10" fill="#8b8b9e">AI Code Security Scanner.</text>
  <text x="218" y="547" font-family="Arial" font-size="10" fill="#8b8b9e">Finds AI-introduced vulns.</text>

  <!-- Learn button -->
  <rect x="218" y="554" width="60" height="22" rx="11" fill="#0d0f1a" stroke="#8b2fc9" stroke-width="1.5"/>
  <text x="248" y="569" font-family="Arial" font-size="10" fill="#e0e0e0" text-anchor="middle" font-weight="600">Learn</text>

  <!-- ── RIGHT CARD ── -->
  <rect x="479" y="298" width="327" height="266" rx="14" fill="#110820" stroke="#2a1040" stroke-width="1"/>

  <!-- Right card top-left section -->
  <text x="498" y="328" font-family="Arial" font-size="15" fill="#ffffff" font-weight="bold">DORA Dashboard</text>
  <text x="498" y="348" font-family="Arial" font-size="10" fill="#8b8b9e">Real-time DevOps metrics.</text>
  <text x="498" y="362" font-family="Arial" font-size="10" fill="#8b8b9e">Track Deployment Frequency,</text>
  <text x="498" y="376" font-family="Arial" font-size="10" fill="#8b8b9e">Lead Time and more on AWS.</text>

  <!-- Right card top-right section -->
  <text x="660" y="328" font-family="Arial" font-size="15" fill="#ffffff" font-weight="bold">MediWatch</text>
  <text x="660" y="348" font-family="Arial" font-size="10" fill="#8b8b9e">Hospital reliability</text>
  <text x="660" y="362" font-family="Arial" font-size="10" fill="#8b8b9e">platform. K8s + Prometheus</text>
  <text x="660" y="376" font-family="Arial" font-size="10" fill="#8b8b9e">self-healing infra.</text>

  <!-- Vertical divider in right card -->
  <line x1="650" y1="298" x2="650" y2="430" stroke="#2a1040" stroke-width="1"/>

  <!-- Divider -->
  <line x1="479" y1="395" x2="806" y2="395" stroke="#2a1040" stroke-width="1"/>

  <!-- DORA icon -->
  <rect x="494" y="408" width="60" height="40" rx="8" fill="#7928ca"/>
  <text x="524" y="433" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="900">📊</text>

  <!-- Monster / illustration area for MediWatch (right side of right card) -->
  <!-- Pink glow circle like the monster in inspiration -->
  <circle cx="730" cy="440" r="44" fill="#2a0a3a" stroke="#ee3399" stroke-width="1.5"/>
  <text x="730" y="434" font-family="Arial" font-size="22" text-anchor="middle">🏥</text>
  <text x="730" y="455" font-family="Arial" font-size="9" fill="#8b8b9e" text-anchor="middle">MediWatch</text>

  <!-- Right card bottom -->
  <text x="494" y="517" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">Multi-Region CI/CD</text>
  <text x="494" y="533" font-family="Arial" font-size="10" fill="#8b8b9e">Enterprise serverless pipeline</text>
  <text x="494" y="547" font-family="Arial" font-size="10" fill="#8b8b9e">on AWS. Disaster recovery built-in.</text>

  <!-- Learn button bottom-left of right card -->
  <rect x="494" y="554" width="55" height="22" rx="11" fill="#0d0f1a" stroke="#8b2fc9" stroke-width="1.5"/>
  <text x="521" y="569" font-family="Arial" font-size="10" fill="#e0e0e0" text-anchor="middle" font-weight="600">Learn</text>

  <!-- Grow button bottom-right of right card -->
  <text x="660" y="517" font-family="Arial" font-size="13" fill="#ffffff" font-weight="bold">tanikush.dev</text>
  <text x="660" y="533" font-family="Arial" font-size="10" fill="#8b8b9e">Portfolio and more projects</text>
  <text x="660" y="547" font-family="Arial" font-size="10" fill="#8b8b9e">available on my website.</text>
  <rect x="660" y="554" width="50" height="22" rx="11" fill="#0d0f1a" stroke="#8b2fc9" stroke-width="1.5"/>
  <text x="685" y="569" font-family="Arial" font-size="10" fill="#e0e0e0" text-anchor="middle" font-weight="600">Grow</text>

  <!-- Vertical divider between bottom sections of right card -->
  <line x1="650" y1="430" x2="650" y2="580" stroke="#2a1040" stroke-width="1"/>

  <!-- Corner accents (matching GrahamTheDev style) -->
  <!-- Top-left -->
  <line x1="203" y1="0" x2="240" y2="0" stroke="#ee3399" stroke-width="2"/>
  <line x1="203" y1="0" x2="203" y2="32" stroke="#ee3399" stroke-width="2"/>
  <!-- Bottom-right -->
  <line x1="820" y1="580" x2="783" y2="580" stroke="#8b2fc9" stroke-width="2"/>
  <line x1="820" y1="580" x2="820" y2="548" stroke="#8b2fc9" stroke-width="2"/>

</svg>
